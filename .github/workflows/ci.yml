name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Test (must not skip)
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test.log
          if grep -qE '^. skipped [1-9]' test.log; then
            echo "::error::A test was skipped. Skips hide failures; fail loudly instead."
            exit 1
          fi

  dco:
    # Without a sign-off on every commit, this code cannot later be reused in the
    # proprietary app. Checked here rather than trusted.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::$sha has no Signed-off-by line"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "Fix with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          }
          echo "dco: all commits signed off"

  gate:
    # The single required check. Stable name, so branch protection never needs editing.
    #
    # `!cancelled()` rather than `always()`: with `always()`, a run cancelled by the
    # concurrency group still schedules `gate`, which then hangs queued forever and
    # blocks the PR on a check that will never report. `!cancelled()` skips the gate on
    # a superseded run — harmless, because the superseding run publishes its own gate —
    # while still running it when a dependency *failed*, which is the case that matters.
    if: ${{ !cancelled() }}
    needs: [build, dco]
    runs-on: ubuntu-latest
    steps:
      - run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "gate: all jobs succeeded or were skipped."
